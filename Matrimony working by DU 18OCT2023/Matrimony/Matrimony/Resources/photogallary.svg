<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
	<!-- Outer frame -->
	<rect x="5" y="5" width="90" height="90" fill="none" stroke="black" stroke-width="4" rx="8" ry="8" />

	<!-- Sun (for sky effect) -->
	<circle cx="25" cy="25" r="10" fill="yellow" />

	<!-- Mountain shapes -->
	<polygon points="20,75 40,40 60,75" fill="#8B4513" />
	<polygon points="50,75 70,50 90,75" fill="#654321" />

	<!-- Ground -->
	<rect x="5" y="70" width="90" height="25" fill="#228B22" />
</svg>
